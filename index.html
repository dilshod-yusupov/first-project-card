<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/footer.css">
    <link rel="stylesheet" href="/CSS/modal.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <title>Карточка товара</title>
</head>

<body>
    <main class="main">
        <div class="products-container">
            <h1 class="products-title">Выбери свой продукт</h1>
            <button class="btn-color style-btn">Покрасить первую карточку</button>
            <button class="btn-color-all style-btn">Покрасить ВСЕ карточки</button>
            <button class="btn-google style-btn">Поискать в Google</button>
            <button class="btn-message style-btn">Показать сообщение</button>
            <button class="toggle-btn ">Переключить цвет</button>

            <ul class="products-list">
                <template id="products-template">
                    <li class="products-list__item card">
                        <img class="card__image" src="img/product-card-image-1.jpg" alt="Товар Увлажняющий мусс">

                        <p class="card__category"></p>

                        <h2 class="card__name"></h2>

                        <p class="card__description"></p>

                        <div class="card__compound compound">
                            <span class="compound__name">Состав</span>

                            <ul class="compound__list">
                            </ul>
                        </div>

                        <div class="card__footer">
                            <div class="card__price-block">
                                <b class="card__price-title">Цена:</b>
                                <span class="card__price-value"> ₽</span>
                            </div>

                            <button class="card__button">Купить</button>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
        <footer class="footer">
            <div class="footer__container">
                <div class="footer__column">
                    <p class="footer__logo">Product Cards</p>

                    <p class="footer__logo-description">У нас самые лучшие продукты для кожи!</p>

                    <div class="footer__container-icon">
                        <svg class="footer__icon-telegram" width="21" height="18" viewBox="0 0 21 18" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M20.9379 1.60272L17.7692 16.5465C17.5299 17.601 16.9067 17.8635 16.0209 17.367L11.1924 13.809L8.86293 16.05C8.60493 16.308 8.38968 16.5232 7.89243 16.5232L8.23968 11.6062L17.1879 3.52047C17.5772 3.17397 17.1032 2.98122 16.5834 3.32847L5.52093 10.2945L0.758428 8.80347C-0.277322 8.48022 -0.296072 7.76772 0.974428 7.27047L19.6022 0.0937215C20.4647 -0.229529 21.2192 0.285721 20.9379 1.60347V1.60272Z"
                                fill="white" />
                        </svg>

                        <svg class="footer__icon-vk" width="24" height="14" viewBox="0 0 24 14" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M23.45 0.948C23.616 0.402 23.45 0 22.655 0H20.03C19.362 0 19.054 0.347 18.887 0.73C18.887 0.73 17.552 3.926 15.661 6.002C15.049 6.604 14.771 6.795 14.437 6.795C14.27 6.795 14.019 6.604 14.019 6.057V0.948C14.019 0.292 13.835 0 13.279 0H9.151C8.734 0 8.483 0.304 8.483 0.593C8.483 1.214 9.429 1.358 9.526 3.106V6.904C9.526 7.737 9.373 7.888 9.039 7.888C8.149 7.888 5.984 4.677 4.699 1.003C4.45 0.288 4.198 0 3.527 0H0.9C0.15 0 0 0.347 0 0.73C0 1.412 0.89 4.8 4.145 9.281C6.315 12.341 9.37 14 12.153 14C13.822 14 14.028 13.632 14.028 12.997V10.684C14.028 9.947 14.186 9.8 14.715 9.8C15.105 9.8 15.772 9.992 17.33 11.467C19.11 13.216 19.403 14 20.405 14H23.03C23.78 14 24.156 13.632 23.94 12.904C23.702 12.18 22.852 11.129 21.725 9.882C21.113 9.172 20.195 8.407 19.916 8.024C19.527 7.533 19.638 7.314 19.916 6.877C19.916 6.877 23.116 2.451 23.449 0.948H23.45Z"
                                fill="white" />
                        </svg>

                        <button class="regist-button">Регистрация</button>

                        <div class="overlay"></div>

                        <div class="modal">
                            <button class="modal-close">×</button>

                            <form action="#" class="regist-form">
                                <label for="first-name">
                                    Имя
                                    <input name="first-name" id="first-name" type="text" placeholder="Имя" required>
                                </label>

                                <label for="last-name">
                                    Фамилия
                                    <input name="last-name" id="last-name" type="text" placeholder="Фамилия" required>
                                </label>

                                <label for="birthday">
                                    Дата рождение
                                    <input name="birthday" id="birthday" type="date" required>
                                </label>

                                <label for="login">
                                    Логин
                                    <input name="login" id="login" type="text" placeholder="Логин" required>
                                </label>

                                <label for="password">
                                    Пароль
                                    <input name="password" id="password" type="password" minlength="6" placeholder="Пароль" required>
                                </label>

                                <label for="repeat-password">
                                    Повтор пароля
                                    <input name="repeat-password" id="repeat-password" type="password" minlength="6"
                                        placeholder="Повторите пароль" required>
                                </label>

                                <input name="regist" id="regist" type="submit" value="Зарегистрироваться">

                                <input name="reset" id="reset" type="reset" value="Сбросить">

                            </form>
                        </div>
                    </div>
                </div>

                <div class="footer__subscription">
                    <p class="footer__title-form">Подпишись на наши акции:</p>

                    <form class="email-form registration-form">
                        <label>
                            <input class="form__input" placeholder="Введи Email..." name="email" type="email" required>
                        </label>

                        <span class="subscribe-form__divider"></span>

                        <button class="form__button" type="submit">Подписаться
                        </button>
                    </form>
                </div>

                <div class="footer__column nav__container">
                    <p class="footer__title-nav">Быстрые ссылки</p>

                    <nav class="footer__nav">
                        <a class="nav__link" href="">Главная</a>
                        <a class="nav__link" href="">Магазин</a>
                        <a class="nav__link" href="">Контакты</a>
                    </nav>
                </div>
            </div>
            <a class="footer__site" href="">www.product-cards.com</a>
            <p class="footer__copyrights"><small>&copy; All rights reserved</small></p>
        </footer>
    </main>

    <script type="module" src="JavaScript/homework-10.js"></script>
    <script type="module" src="JavaScript/homework-11.js"></script>


</body>

</html>
